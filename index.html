<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestão de Atividades</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css" />
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f8f7f4;
    --bg-tertiary: #f1efe8;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-tertiary: #9e9e9e;
    --border-light: rgba(0,0,0,0.1);
    --border-medium: rgba(0,0,0,0.18);
    --accent: #534AB7;
    --accent-dark: #3C3489;
    --accent-light: #EEEDFE;
    --radius-sm: 8px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1e1e1e;
      --bg-secondary: #2a2a2a;
      --bg-tertiary: #242424;
      --text-primary: #f0f0f0;
      --text-secondary: #aaaaaa;
      --text-tertiary: #777777;
      --border-light: rgba(255,255,255,0.1);
      --border-medium: rgba(255,255,255,0.18);
      --accent-light: #2e2a55;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-tertiary); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; }

  /* LOGIN */
  #loginScreen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { background: var(--bg-primary); border: 0.5px solid var(--border-light); border-radius: var(--radius-lg); padding: 32px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 16px; }
  .login-icon { text-align: center; font-size: 40px; color: var(--accent); }
  .login-title { font-size: 18px; font-weight: 600; text-align: center; }
  .login-sub { font-size: 13px; color: var(--text-secondary); text-align: center; line-height: 1.5; }
  .login-input { padding: 11px 14px; border-radius: var(--radius-sm); border: 0.5px solid var(--border-medium); font-size: 14px; background: var(--bg-secondary); color: var(--text-primary); width: 100%; }
  .login-input:focus { outline: none; border-color: var(--accent); }
  .login-btn { padding: 11px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: white; font-size: 14px; font-weight: 500; cursor: pointer; }
  .login-btn:hover { background: var(--accent-dark); }

  /* MAIN APP */
  #mainApp { display: none; flex-direction: column; height: 100vh; }
  .share-bar { padding: 8px 16px; background: var(--accent-light); border-bottom: 0.5px solid var(--border-light); display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--accent-dark); flex-shrink: 0; }
  .share-url { flex: 1; background: var(--bg-primary); border: 0.5px solid var(--border-light); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--text-secondary); font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .copy-btn { padding: 4px 12px; border-radius: 6px; border: 0.5px solid var(--accent); background: none; color: var(--accent); font-size: 12px; cursor: pointer; white-space: nowrap; }
  .copy-btn:hover { background: var(--accent); color: white; }
  .app-body { flex: 1; display: grid; grid-template-columns: 280px 1fr; overflow: hidden; }

  /* SIDEBAR */
  .sidebar { border-right: 0.5px solid var(--border-light); display: flex; flex-direction: column; background: var(--bg-secondary); overflow: hidden; }
  .sidebar-header { padding: 12px 14px; border-bottom: 0.5px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .sidebar-title { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #639922; flex-shrink: 0; }
  .sync-dot.syncing { background: #EF9F27; animation: pulse 1s infinite; }
  .sync-dot.offline { background: #E24B4A; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .add-btn { background: none; border: 0.5px solid var(--border-medium); border-radius: var(--radius-sm); padding: 4px 10px; cursor: pointer; font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 3px; }
  .add-btn:hover { background: var(--bg-primary); }
  .task-list { flex: 1; overflow-y: auto; padding: 8px; }
  .task-item { padding: 11px 12px; border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 6px; border: 0.5px solid var(--border-light); background: var(--bg-primary); transition: border-color 0.15s; }
  .task-item:hover { border-color: var(--border-medium); }
  .task-item.active { border-color: var(--accent); }
  .task-name { font-size: 13px; font-weight: 500; margin-bottom: 5px; line-height: 1.3; }
  .task-badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 2px 7px; border-radius: 20px; }
  .badge-todo { background: #EEEDFE; color: #3C3489; }
  .badge-progress { background: #FAEEDA; color: #633806; }
  .badge-done { background: #EAF3DE; color: #27500A; }
  .badge-blocked { background: #FCEBEB; color: #791F1F; }
  .badge-low { background: #E1F5EE; color: #085041; }
  .badge-medium { background: #FAEEDA; color: #633806; }
  .badge-high { background: #FAECE7; color: #712B13; }
  .badge-critical { background: #FCEBEB; color: #791F1F; }
  .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }

  /* FORM */
  .add-task-form { padding: 10px 14px; border-top: 0.5px solid var(--border-light); display: none; flex-direction: column; gap: 7px; flex-shrink: 0; }
  .add-task-form.open { display: flex; }
  .form-input { padding: 8px 10px; border-radius: var(--radius-sm); border: 0.5px solid var(--border-medium); font-size: 13px; background: var(--bg-primary); color: var(--text-primary); width: 100%; font-family: inherit; }
  .form-input:focus { outline: none; border-color: var(--accent); }
  .form-row { display: flex; gap: 7px; }
  .form-btn { flex: 1; padding: 8px; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; border: 0.5px solid var(--border-medium); font-family: inherit; }
  .form-btn-confirm { background: var(--accent); color: white; border-color: var(--accent); }
  .form-btn-confirm:hover { background: var(--accent-dark); }
  .form-btn-cancel { background: none; color: var(--text-secondary); }
  .form-btn-cancel:hover { background: var(--bg-secondary); }

  /* MAIN PANEL */
  .main { display: flex; flex-direction: column; overflow: hidden; background: var(--bg-primary); }
  .main-header { padding: 10px 14px; border-bottom: 0.5px solid var(--border-light); display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
  .tab-btn { padding: 5px 12px; border-radius: var(--radius-sm); border: 0.5px solid transparent; font-size: 12px; cursor: pointer; color: var(--text-secondary); background: none; font-family: inherit; }
  .tab-btn:hover { background: var(--bg-secondary); }
  .tab-btn.active { background: var(--bg-secondary); border-color: var(--border-medium); color: var(--text-primary); font-weight: 500; }
  .hdr-select { font-size: 12px; padding: 5px 8px; border-radius: var(--radius-sm); border: 0.5px solid var(--border-medium); background: var(--bg-secondary); color: var(--text-primary); cursor: pointer; margin-left: auto; font-family: inherit; }
  .hdr-select + .hdr-select { margin-left: 4px; }

  /* PANELS */
  .panel { flex: 1; overflow-y: auto; display: none; flex-direction: column; }
  .panel.active { display: flex; }
  .detail-panel { padding: 16px; gap: 12px; }
  .detail-block { background: var(--bg-secondary); border-radius: var(--radius-sm); padding: 13px 15px; }
  .detail-label { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 7px; }
  .detail-desc { font-size: 13px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; color: var(--text-primary); }
  .detail-value { font-size: 13px; color: var(--text-primary); }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chat-panel { padding: 14px; gap: 10px; }

  /* MESSAGES */
  .msg { display: flex; gap: 8px; align-items: flex-start; }
  .msg.user-msg { flex-direction: row-reverse; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .bubble { max-width: 78%; padding: 9px 13px; border-radius: var(--radius-lg); font-size: 13px; line-height: 1.6; }
  .bubble-ai { background: var(--bg-secondary); border: 0.5px solid var(--border-light); border-top-left-radius: 4px; color: var(--text-primary); }
  .bubble-user { background: #EEEDFE; color: #26215C; border-top-right-radius: 4px; }
  .bubble-other { background: var(--bg-secondary); border: 0.5px solid var(--border-light); border-top-left-radius: 4px; color: var(--text-primary); }
  .bubble-system { font-size: 12px; color: var(--text-tertiary); text-align: center; padding: 2px 0; width: 100%; }
  .msg-meta { font-size: 11px; opacity: 0.5; margin-top: 3px; display: block; }
  .user-chip { display: inline-flex; font-size: 11px; padding: 1px 8px; border-radius: 20px; background: #EEEDFE; color: #3C3489; margin-bottom: 3px; }

  /* INPUT */
  .input-area { padding: 10px 14px; border-top: 0.5px solid var(--border-light); display: none; gap: 8px; align-items: flex-end; flex-shrink: 0; }
  .chat-input { flex: 1; padding: 9px 12px; border-radius: var(--radius-lg); border: 0.5px solid var(--border-medium); font-size: 13px; resize: none; min-height: 42px; max-height: 100px; background: var(--bg-secondary); color: var(--text-primary); font-family: inherit; }
  .chat-input:focus { outline: none; border-color: var(--accent); }
  .send-btn { width: 38px; height: 38px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
  .send-btn:hover { background: var(--accent-dark); }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-tertiary); font-size: 13px; }

  .typing { display: flex; gap: 4px; align-items: center; padding: 2px 0; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  @media (max-width: 600px) {
    .app-body { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .sidebar.show { display: flex; position: absolute; z-index: 10; width: 80%; height: calc(100% - 80px); top: 80px; left: 0; box-shadow: 4px 0 20px rgba(0,0,0,0.15); }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-icon"><i class="ti ti-layout-kanban"></i></div>
    <div class="login-title">Gestão de Atividades</div>
    <div class="login-sub">Entre com seu nome para acessar o board compartilhado com o time</div>
    <input class="login-input" id="nameInput" placeholder="Seu nome..." maxlength="30" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="login-btn" onclick="doLogin()">Entrar no board</button>
  </div>
</div>

<div id="mainApp">
  <div class="share-bar">
    <i class="ti ti-users" style="font-size:14px"></i>
    <span style="font-weight:500">Compartilhe com o time:</span>
    <div class="share-url" id="shareUrl"></div>
    <button class="copy-btn" onclick="copyLink()" id="copyBtn">Copiar link</button>
  </div>

  <div class="app-body">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">
          <span class="sync-dot" id="syncDot"></span>
          Atividades
        </span>
        <button class="add-btn" onclick="toggleForm()">
          <i class="ti ti-plus" style="font-size:13px"></i> Nova
        </button>
      </div>
      <div class="task-list" id="taskList"></div>
      <div class="add-task-form" id="addForm">
        <input class="form-input" id="newTaskName" placeholder="Nome da atividade..." />
        <textarea class="form-input" id="newTaskDesc" placeholder="O que precisa ser feito..." rows="3" style="resize:none"></textarea>
        <input class="form-input" id="newTaskOwner" placeholder="Responsável..." />
        <select class="form-input" id="newTaskImportance">
          <option value="low">Importância: Baixa</option>
          <option value="medium" selected>Importância: Média</option>
          <option value="high">Importância: Alta</option>
          <option value="critical">Importância: Crítica</option>
        </select>
        <div class="form-row">
          <button class="form-btn form-btn-cancel" onclick="toggleForm()">Cancelar</button>
          <button class="form-btn form-btn-confirm" onclick="addTask()">Adicionar</button>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="main-header" id="mainHeader">
        <button class="tab-btn active" id="tabDetail" onclick="switchTab('detail')" style="display:none">
          <i class="ti ti-info-circle" style="font-size:13px;margin-right:3px"></i>Detalhes
        </button>
        <button class="tab-btn" id="tabChat" onclick="switchTab('chat')" style="display:none">
          <i class="ti ti-message-circle" style="font-size:13px;margin-right:3px"></i>Chat
        </button>
        <select class="hdr-select" id="statusSelect" onchange="changeField('status',this.value)" style="display:none">
          <option value="todo">Não iniciado</option>
          <option value="progress">Em andamento</option>
          <option value="done">Concluído</option>
          <option value="blocked">Bloqueado</option>
        </select>
        <select class="hdr-select" id="importanceSelect" onchange="changeField('importance',this.value)" style="display:none">
          <option value="low">Import.: Baixa</option>
          <option value="medium">Import.: Média</option>
          <option value="high">Import.: Alta</option>
          <option value="critical">Import.: Crítica</option>
        </select>
      </div>

      <div class="panel detail-panel active" id="panelDetail">
        <div class="empty-state" id="detailEmpty">
          <i class="ti ti-layout-kanban" style="font-size:36px"></i>
          <span>Selecione uma atividade</span>
        </div>
        <div id="detailContent" style="display:none;flex-direction:column;gap:12px">
          <div class="detail-block">
            <div class="detail-label">Descrição</div>
            <div class="detail-desc" id="detailDesc"></div>
          </div>
          <div class="meta-grid">
            <div class="detail-block">
              <div class="detail-label">Status</div>
              <div id="detailStatus"></div>
            </div>
            <div class="detail-block">
              <div class="detail-label">Importância</div>
              <div id="detailImportance"></div>
            </div>
            <div class="detail-block">
              <div class="detail-label">Responsável</div>
              <div class="detail-value" id="detailOwner"></div>
            </div>
            <div class="detail-block">
              <div class="detail-label">Criado por</div>
              <div class="detail-value" id="detailCreated"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel chat-panel" id="panelChat">
        <div class="empty-state" id="chatEmpty">
          <i class="ti ti-message-circle" style="font-size:36px"></i>
          <span>Selecione uma atividade</span>
        </div>
        <div id="chatMessages" style="display:none;flex-direction:column;gap:10px"></div>
      </div>

      <div class="input-area" id="inputArea">
        <textarea class="chat-input" id="chatInput" placeholder="Pergunte, atualize ou comente..." rows="1" onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" onclick="sendMessage()"><i class="ti ti-send"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
const ANTHROPIC_KEY = 'COLE_SUA_CHAVE_AQUI';

const STATUS = {
  todo:    { label:'Não iniciado', badge:'badge-todo',     dot:'#7F77DD' },
  progress:{ label:'Em andamento', badge:'badge-progress', dot:'#EF9F27' },
  done:    { label:'Concluído',    badge:'badge-done',     dot:'#639922' },
  blocked: { label:'Bloqueado',    badge:'badge-blocked',  dot:'#E24B4A' },
};
const IMPORTANCE = {
  low:     { label:'Baixa',   badge:'badge-low' },
  medium:  { label:'Média',   badge:'badge-medium' },
  high:    { label:'Alta',    badge:'badge-high' },
  critical:{ label:'Crítica', badge:'badge-critical' },
};
const AVATAR_COLORS = ['#EEEDFE:#3C3489','#E1F5EE:#085041','#FAEEDA:#633806','#FAECE7:#712B13','#E6F1FB:#0C447C'];

let currentUser = '', currentId = null, tasks = [], currentTab = 'detail';
const DB_KEY = 'board-tasks-v1';

function ts() { return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function avatarColor(n) { const i=n.charCodeAt(0)%AVATAR_COLORS.length; const[bg,c]=AVATAR_COLORS[i].split(':'); return{bg,c}; }
function initials(n) { return n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function setSyncDot(s) { const d=document.getElementById('syncDot'); d.className='sync-dot'+(s==='syncing'?' syncing':s==='offline'?' offline':''); }

function saveLocal() { localStorage.setItem(DB_KEY, JSON.stringify({tasks, updated: Date.now()})); }
function loadLocal() { try { const r=localStorage.getItem(DB_KEY); if(r) tasks=JSON.parse(r).tasks||[]; } catch(e){} }

function doLogin() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;
  currentUser = name;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  document.getElementById('shareUrl').textContent = window.location.href;
  loadLocal();
  if (!tasks.length) {
    tasks = [
      {id:1,name:'Implementação MFA no site',desc:'Configurar autenticação multifator para todos os usuários.\n\n• Avaliar bibliotecas TOTP disponíveis\n• Integrar com o fluxo de login existente\n• Adicionar tela de configuração no perfil\n• Testes de regressão em todos os fluxos de autenticação',owner:'Time Dev',status:'progress',importance:'critical',history:[{user:'Sistema',text:'Atividade criada.',time:ts()}]},
      {id:2,name:'Revisão de segurança',desc:'Auditar permissões de acesso de todos os módulos.\n\n• Verificar tokens expirados e sessões ativas\n• Revisar logs dos últimos 30 dias\n• Corrigir vulnerabilidades do último pentest\n• Atualizar dependências com CVEs conhecidos',owner:'Ana',status:'todo',importance:'high',history:[{user:'Sistema',text:'Atividade criada.',time:ts()}]},
      {id:3,name:'Deploy em produção',desc:'Subir versão 2.1 para produção com rollback automático.\n\n• Smoke tests pós-deploy\n• Notificação para o time após conclusão\n• Atualizar documentação de release',owner:'Carlos',status:'done',importance:'medium',history:[{user:'Sistema',text:'Atividade criada.',time:ts()},{user:'Carlos',text:'Deploy realizado com sucesso às 14h. Versão 2.1 em prod.',time:ts()}]},
    ];
    saveLocal();
  }
  renderSidebar();
  setSyncDot('ok');
  setInterval(() => { loadLocal(); renderSidebar(); if(currentId){ const t=tasks.find(x=>x.id===currentId); if(t&&currentTab==='detail') renderDetail(t); if(t&&currentTab==='chat') renderChat(); } }, 3000);
}

function renderSidebar() {
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  tasks.forEach(t => {
    const s = STATUS[t.status], im = IMPORTANCE[t.importance||'medium'];
    const div = document.createElement('div');
    div.className = 'task-item' + (currentId===t.id?' active':'');
    div.innerHTML = `<div class="task-name">${t.name}</div>
      <div class="task-badges">
        <span class="badge ${s.badge}"><span class="status-dot" style="background:${s.dot}"></span>${s.label}</span>
        <span class="badge ${im.badge}"><i class="ti ti-star" style="font-size:11px"></i>${im.label}</span>
      </div>`;
    div.onclick = () => selectTask(t.id);
    list.appendChild(div);
  });
}

function renderDetail(t) {
  document.getElementById('detailEmpty').style.display = 'none';
  const dc = document.getElementById('detailContent');
  dc.style.display = 'flex';
  const s = STATUS[t.status], im = IMPORTANCE[t.importance||'medium'];
  document.getElementById('detailDesc').textContent = t.desc || 'Sem descrição.';
  document.getElementById('detailStatus').innerHTML = `<span class="badge ${s.badge}" style="font-size:12px"><span class="status-dot" style="background:${s.dot}"></span>${s.label}</span>`;
  document.getElementById('detailImportance').innerHTML = `<span class="badge ${im.badge}" style="font-size:12px"><i class="ti ti-star" style="font-size:12px"></i>${im.label}</span>`;
  document.getElementById('detailOwner').textContent = t.owner || '—';
  const creator = t.history?.[0]?.user || '—';
  document.getElementById('detailCreated').textContent = creator === 'Sistema' ? '—' : creator;
}

function renderChat() {
  const t = tasks.find(x => x.id===currentId);
  if (!t) return;
  document.getElementById('chatEmpty').style.display = 'none';
  const msgs = document.getElementById('chatMessages');
  msgs.style.display = 'flex';
  msgs.innerHTML = '';
  t.history.forEach(m => appendBubbleEl(msgs, m));
  document.getElementById('panelChat').scrollTop = 99999;
}

function appendBubbleEl(container, m) {
  const isMe = m.user === currentUser;
  const isSystem = m.user==='Sistema' || m.user==='IA';
  const div = document.createElement('div');
  if (isSystem) {
    div.className = 'msg';
    div.innerHTML = `<div class="bubble bubble-system" style="width:100%;text-align:center">${m.user==='IA'?'<strong>IA:</strong> ':''}${m.text}<span class="msg-meta">${m.time}</span></div>`;
  } else {
    div.className = 'msg' + (isMe?' user-msg':'');
    const av = avatarColor(m.user);
    div.innerHTML = `<div class="avatar" style="background:${av.bg};color:${av.c}">${initials(m.user)}</div>
      <div class="bubble ${isMe?'bubble-user':'bubble-other'}">${!isMe?`<span class="user-chip">${m.user}</span><br>`:''}${m.text}<span class="msg-meta">${m.time}</span></div>`;
  }
  container.appendChild(div);
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabDetail').className = 'tab-btn' + (tab==='detail'?' active':'');
  document.getElementById('tabChat').className = 'tab-btn' + (tab==='chat'?' active':'');
  document.getElementById('panelDetail').className = 'panel detail-panel' + (tab==='detail'?' active':'');
  document.getElementById('panelChat').className = 'panel chat-panel' + (tab==='chat'?' active':'');
  if (tab==='chat' && currentId) renderChat();
}

function selectTask(id) {
  currentId = id;
  const t = tasks.find(x => x.id===id);
  ['tabDetail','tabChat'].forEach(b => document.getElementById(b).style.display='');
  ['statusSelect','importanceSelect','inputArea'].forEach(s => document.getElementById(s).style.display='');
  document.getElementById('statusSelect').value = t.status;
  document.getElementById('importanceSelect').value = t.importance||'medium';
  renderSidebar();
  renderDetail(t);
  switchTab('detail');
}

function changeField(field, val) {
  const t = tasks.find(x => x.id===currentId);
  if (!t) return;
  const labels = {status:STATUS, importance:IMPORTANCE};
  const names = {status:'status', importance:'importância'};
  const old = labels[field][t[field]||'medium'].label;
  t[field] = val;
  const entry = {user:'Sistema', text:`${currentUser} alterou ${names[field]} de "${old}" para "${labels[field][val].label}".`, time:ts()};
  t.history.push(entry);
  saveLocal();
  renderSidebar();
  renderDetail(t);
  if (currentTab==='chat') { const msgs=document.getElementById('chatMessages'); appendBubbleEl(msgs,entry); document.getElementById('panelChat').scrollTop=99999; }
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !currentId) return;
  input.value = '';
  input.style.height = 'auto';
  const t = tasks.find(x => x.id===currentId);
  const entry = {user:currentUser, text, time:ts()};
  t.history.push(entry);
  if (currentTab !== 'chat') switchTab('chat');
  const msgs = document.getElementById('chatMessages');
  document.getElementById('chatEmpty').style.display = 'none';
  msgs.style.display = 'flex';
  appendBubbleEl(msgs, entry);
  const panel = document.getElementById('panelChat');
  panel.scrollTop = 99999;
  saveLocal();

  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg';
  typingDiv.innerHTML = `<div class="avatar" style="background:#EEEDFE;color:#3C3489">IA</div><div class="bubble bubble-ai"><div class="typing"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(typingDiv);
  panel.scrollTop = 99999;

  const im = IMPORTANCE[t.importance||'medium'];
  const histTxt = t.history.slice(-8).map(h=>`${h.user}: ${h.text}`).join('\n');
  const sysPrompt = `Você é um assistente de gestão de atividades de um time. Responda em português, de forma direta (máximo 3 frases). Contexto:\n- Atividade: ${t.name}\n- Descrição: ${t.desc}\n- Responsável: ${t.owner}\n- Status: ${STATUS[t.status].label}\n- Importância: ${im.label}\n- Usuário: ${currentUser}\n- Histórico:\n${histTxt}\n\nSe perguntarem sobre status ou importância, explique claramente. Seja conciso.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': ANTHROPIC_KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000, system:sysPrompt, messages:[{role:'user',content:text}] })
    });
    const data = await res.json();
    typingDiv.remove();
    const reply = data.content?.[0]?.text || 'Não consegui processar.';
    const aiEntry = {user:'IA', text:reply, time:ts()};
    t.history.push(aiEntry);
    appendBubbleEl(msgs, aiEntry);
    panel.scrollTop = 99999;
    saveLocal();
  } catch(e) {
    typingDiv.remove();
    appendBubbleEl(msgs, {user:'Sistema', text:'Erro ao conectar com o assistente IA.', time:ts()});
  }
}

function handleKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  const ta = document.getElementById('chatInput');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight,100)+'px';
}

function toggleForm() {
  const f = document.getElementById('addForm');
  f.classList.toggle('open');
  if (f.classList.contains('open')) document.getElementById('newTaskName').focus();
}

function addTask() {
  const name = document.getElementById('newTaskName').value.trim();
  if (!name) return;
  const maxId = tasks.reduce((m,t)=>Math.max(m,t.id),0);
  tasks.push({
    id: maxId+1, name,
    desc: document.getElementById('newTaskDesc').value.trim(),
    owner: document.getElementById('newTaskOwner').value.trim()||'—',
    status: 'todo',
    importance: document.getElementById('newTaskImportance').value,
    history: [{user:currentUser, text:'Atividade criada.', time:ts()}]
  });
  document.getElementById('newTaskName').value = '';
  document.getElementById('newTaskDesc').value = '';
  document.getElementById('newTaskOwner').value = '';
  toggleForm();
  renderSidebar();
  saveLocal();
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copiado!';
    setTimeout(() => btn.textContent = 'Copiar link', 2000);
  });
}
</script>
